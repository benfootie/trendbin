<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | Trendbin</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #10b981; }
    body { background-color: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; line-height: 1.6; padding: 24px 16px; margin: 0; }
    .container { max-width: 800px; margin: 0 auto; background: var(--card); padding: 40px; border-radius: 12px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .nav { margin-bottom: 30px; font-size: 0.9rem; }
    h1 { margin-top: 0; color: var(--accent); }
    .date { color: #94a3b8; font-size: 0.85rem; margin-bottom: 24px; }
    img { max-width: 100%; border-radius: 8px; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="/index.html">← Back to Dashboard</a> | <a href="/blog.html">Read more articles</a>
    </div>
    <h1>{{ page.title }}</h1>
    <div class="date">{{ page.date | date: "%B %d, %Y" }}</div>
    
    <div class="content">
      {{ content }}
    </div>
  </div>
</body>
</html>
